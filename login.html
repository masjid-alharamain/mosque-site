<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول | مسجد الحرمين</title>

<style>
body{
font-family:Cairo,sans-serif;
background:#0d6b3c;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.login-box{
background:#fff;
padding:30px;
border-radius:15px;
width:320px;
text-align:center;
box-shadow:0 10px 25px rgba(0,0,0,.2);
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:8px;
box-sizing:border-box;
}

button{
width:100%;
padding:12px;
background:#0d6b3c;
color:#fff;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#09552f;
}

#error{
color:red;
margin-top:10px;
}
</style>

</head>

<body>

<div class="login-box">

<h2>لوحة إدارة مسجد الحرمين</h2>

<input type="email" id="email" placeholder="البريد الإلكتروني">

<input type="password" id="password" placeholder="كلمة المرور">

<button id="loginBtn">
تسجيل الدخول
</button>

<p id="error"></p>

</div>

<script type="module" src="js/login.js"></script>

</body>
</html>
